android.useAndroidX=true
kotlin.code.style=official

# NOTE: Do NOT set org.gradle.java.installations.paths here. A machine-specific
# absolute JDK path (e.g. a Windows "C:\..." path) is parsed AS A URI by Gradle's
# Daemon JVM discovery (gradle-daemon-jvm.properties, toolchainVersion=17) BEFORE
# any existence check, which throws URISyntaxException on Linux CI runners and
# breaks the build. Per-machine JDK locations belong in your user-level
# ~/.gradle/gradle.properties (never committed), not in this shared file. CI's
# setup-java and a local JAVA_HOME pointing at JDK 17 already satisfy the daemon.

# ── Memory ───────────────────────────────────────────────────────────────
# Two long-lived JVMs do the work: the Gradle daemon (which also runs the
# AGP/KSP worker threads) and the Kotlin compile daemon. 2048m each was
# leaving both of them GC-thrashing through a Compose + Hilt + Room build.
# MaxMetaspaceSize is capped explicitly because the Gradle daemon otherwise
# grows metaspace unboundedly across reloads of this many plugins and gets
# killed hours into a session. ParallelGC beats G1 for the short, allocation
# heavy bursts a build JVM does — G1's concurrent cycles are wasted here.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx4096m

# ── Parallelism ──────────────────────────────────────────────────────────
# NOTE: Do NOT set org.gradle.workers.max=1 again. It was added to dodge a KSP
# "failed to make parent directories" race on Windows, but it is a global
# handbrake: every task takes a worker lease, so a lease pool of 1 serialises
# the ENTIRE build — dexing, resource merging and lint included, none of which
# were ever part of that race. The race is between the two KSP tasks that
# mkdir into overlapping generated-source trees; app/build.gradle.kts pins
# their order directly instead, which costs nothing.
org.gradle.parallel=true
org.gradle.caching=true
